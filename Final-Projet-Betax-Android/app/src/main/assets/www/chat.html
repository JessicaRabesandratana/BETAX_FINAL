<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Betax Chat</title>
  <style>
    body { font-family: sans-serif; background: #EEF8FF; margin: 0; padding: 10px; display: flex; flex-direction: column; height: 95vh; }
    #messages { flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
    .msg { max-width: 80%; padding: 10px; border-radius: 8px; font-size: 14px; line-height: 1.4; }
    .user { background: #0076FF; color: white; align-self: flex-end; }
    .bot { background: white; color: #333; align-self: flex-start; border: 1px solid #D0E8FF; }
    #input-area { display: flex; gap: 8px; padding: 10px; background: white; border-radius: 8px; }
    input { flex: 1; padding: 8px; border: 1px solid #CCC; border-radius: 4px; }
    button { background: #0076FF; color: white; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; }
  </style>
</head>
<body>
  <div id="messages">
    <div class="msg bot">Bonjour ! Comment puis-je vous aider aujourd'hui ?</div>
  </div>
  <div id="input-area">
    <input type="text" id="chat-input" placeholder="Posez votre question...">
    <button id="send-btn">Envoyer</button>
  </div>

  <script>
    const messagesEl = document.getElementById('messages');
    const input = document.getElementById('chat-input');
    const send = document.getElementById('send-btn');

    let conversation = [
      { role: 'assistant', content: "Bonjour ! Comment puis-je vous aider aujourd'hui ?" }
    ];

    function sendMessage() {
      const text = input.value.trim();
      if (!text) return;

      // Append User message
      const userDiv = document.createElement('div');
      userDiv.className = 'msg user';
      userDiv.textContent = text;
      messagesEl.appendChild(userDiv);
      conversation.push({ role: 'user', content: text });
      input.value = '';
      messagesEl.scrollTop = messagesEl.scrollHeight;

      // Append Placeholder for Bot response
      const botDiv = document.createElement('div');
      botDiv.className = 'msg bot';
      botDiv.textContent = 'En train de réfléchir...';
      messagesEl.appendChild(botDiv);
      messagesEl.scrollTop = messagesEl.scrollHeight;

      // Prepare payload and delegate network call to native bridge
      const payload = JSON.stringify({
        messages: conversation,
        model: 'llama-3.3-70b-versatile',
        max_tokens: 500,
        temperature: 0.5
      });

      try {
        if (window.BetaxAndroid && typeof window.BetaxAndroid.sendChatMessage === 'function') {
          window._pendingBotPlaceholder = botDiv;
          window.BetaxAndroid.sendChatMessage(payload);
        } else {
          throw new Error('Native bridge unavailable');
        }
      } catch (e) {
        botDiv.textContent = 'Erreur: ' + e.message;
      }
    }

    // Called by native when the backend responds (JSON string)
    window.handleNativeResponse = function(responseJson) {
      try {
        const data = JSON.parse(responseJson);
        const botMsg = data.reply
          || (data.response && data.response.choices && data.response.choices[0] && data.response.choices[0].message && data.response.choices[0].message.content)
          || JSON.stringify(data.result || data);

        const last = window._pendingBotPlaceholder || messagesEl.querySelector('.bot:last-child');
        if (last) last.textContent = botMsg;
        conversation.push({ role: 'assistant', content: botMsg });
      } catch (e) {
        const last = window._pendingBotPlaceholder || messagesEl.querySelector('.bot:last-child');
        if (last) last.textContent = 'Erreur parsing response';
      } finally {
        window._pendingBotPlaceholder = null;
        messagesEl.scrollTop = messagesEl.scrollHeight;
      }
    }

    window.handleNativeError = function(errMsg) {
      const last = window._pendingBotPlaceholder || messagesEl.querySelector('.bot:last-child');
      if (last) last.textContent = 'Erreur natif: ' + errMsg;
      window._pendingBotPlaceholder = null;
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    send.addEventListener('click', sendMessage);
    input.addEventListener('keydown', e => { if (e.key === 'Enter') sendMessage(); });
  </script>
</body>
</html>
