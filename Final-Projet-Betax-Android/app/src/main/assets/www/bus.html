<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0b9c83" />
  <meta name="description" content="Lignes de bus Betax à Antananarivo." />
  <title>Betax - Lignes</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="css/style.css" />
  <script src="js/app.js" defer></script>
</head>
<body data-page="bus">
  <header class="app-header">
    <a class="brand" href="index.html" aria-label="Final Projet Betax, accueil">
      <img class="logo" src="Image/logo.jpeg" alt="Logo Betax" />
      <span>
        <strong>BETAX</strong>
        <small>Lignes de bus</small>
      </span>
    </a>
    <div class="header-actions">
      <a class="header-action" href="contact.html">
        <span aria-hidden="true">i</span> Infos
      </a>
      <img class="partner-logo" src="Image/ispm.jpeg" alt="Logo ISPM" />
    </div>
  </header>
  <main class="page-shell">
    <section class="page-heading">
      <p class="eyebrow">Lignes</p>
      <h1>Trouvez une ligne de bus</h1>
      <p>Ouvrez ensuite sa fiche pour visualiser tous les arrêts répertoriés et l'ajouter à vos favoris.</p>
    </section>
    <section class="search-card" aria-label="Recherche de ligne">
      <form id="busSearchForm" class="search-form" novalidate>
        <label for="busInput">Nom ou numéro de la ligne</label>
        <div class="search-row">
          <input id="busInput" name="bus" type="search" autocomplete="off" placeholder="Ex. 137, 147 Bis" />
          <button class="button button-primary" type="submit">Rechercher</button>
        </div>
      </form>
      <div class="browse-row" id="popularRoutes" aria-label="Lignes rapides"></div>
    </section>
    <section class="result-panel" aria-live="polite" aria-label="Résultats de la recherche">
      <div id="busResults" class="result-list">
        <p class="empty-state">Entrez une ligne pour afficher sa fiche détaillée.</p>
      </div>
    </section>
  </main>
  <nav class="bottom-nav" aria-label="Navigation principale">
    <a href="index.html" class="nav-btn">
      <span aria-hidden="true">⌂</span>
      <span>Accueil</span></a>
    <a href="trajet.html" class="nav-btn">
      <span aria-hidden="true">⌁</span>
      <span>Trajet</span>
    </a>
    <a href="bus.html" class="nav-btn active">
      <span aria-hidden="true">🚌</span>
      <span>Lignes</span>
    </a>
    <a href="arret.html" class="nav-btn">
      <span aria-hidden="true">⌖</span>
      <span>Arrêts</span>
    </a>
    <a href="map.html" class="nav-btn">
      <span aria-hidden="true">◉</span>
      <span>Carte</span>
    </a>
  </nav>
</body>
</html>
